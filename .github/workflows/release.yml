name: Release image

# Publishes the ready-to-run image to the GitHub Container Registry, for amd64
# and arm64 (each built on a native runner, then joined in one tag):
#   a push to main      ghcr.io/<owner>/agent-army:latest and :sha-<commit>
#   a tag vX.Y.Z        :X.Y.Z, :X.Y and :sha-<commit> (tag the package.json version)
# A new package is private, even in a public repo: after the first run, open the
# package on GitHub > Package settings > Change visibility > Public, so anyone
# can pull it without logging in (README > Deploy anywhere).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: true

env:
  # Shown on the package's page (labels on each image, annotations on the index).
  IMAGE_DESCRIPTION: >-
    Self-hosted Slack and web assistant with a team of Claude agents that turns
    requests into pull requests. Deploy it anywhere:
    https://github.com/${{ github.repository }}#deploy-anywhere
  IMAGE_DOCS: https://github.com/${{ github.repository }}#deploy-anywhere

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.title=Agent Army
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=${{ env.IMAGE_DOCS }}
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}
      - name: Save the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.suffix }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    name: Publish the tags
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join both platforms under the commit, and latest or the version
        working-directory: /tmp/digests
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=(-t "$image:sha-${GITHUB_SHA::7}")
          case "$GITHUB_REF" in
            refs/heads/main)
              tags+=(-t "$image:latest") ;;
            refs/tags/v*)
              version="${GITHUB_REF#refs/tags/v}"
              tags+=(-t "$image:$version")
              # 1.4.2 is also 1.4; a pre-release (1.5.0-rc.1) is only itself.
              if [[ "$version" =~ ^([0-9]+\.[0-9]+)\.[0-9]+$ ]]; then tags+=(-t "$image:${BASH_REMATCH[1]}"); fi ;;
          esac
          digests=()
          for digest in *; do digests+=("$image@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.description=$IMAGE_DESCRIPTION" \
            --annotation "index:org.opencontainers.image.documentation=$IMAGE_DOCS" \
            --annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            "${digests[@]}"
          docker buildx imagetools inspect "$image:sha-${GITHUB_SHA::7}"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-army.fullname" . }}
  labels:
    {{- include "agent-army.labels" . | nindent 4 }}
spec:
  # One instance only: per-thread queues and event dedupe live in memory.
  replicas: 1
  # The old pod stops before the new one starts (a ReadWriteOnce volume, one instance).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "agent-army.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-army.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: agent-army
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: RUNNER
              value: local
            - name: STORAGE
              value: fs
            - name: DATA_DIR
              value: /data
            - name: REQUIRE_MASTER_KEY
              value: "1"
            {{- with include "agent-army.publicUrl" . }}
            - name: PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            - name: MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-army.secretName" . }}
                  key: MASTER_KEY
            - name: SETUP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-army.secretName" . }}
                  key: SETUP_TOKEN
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            # Headless Chromium needs more shared memory than the container default.
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "agent-army.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

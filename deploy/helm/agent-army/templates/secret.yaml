{{- if not .Values.existingSecret }}
{{- $name := include "agent-army.fullname" . }}
{{- /* Keep generated keys across upgrades: read the Secret this release created. */}}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "agent-army.labels" . | nindent 4 }}
  annotations:
    # MASTER_KEY decrypts the data on the volume: keep it when the release is uninstalled.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if .Values.masterKey }}
  MASTER_KEY: {{ .Values.masterKey | b64enc | quote }}
  {{- else if get $old "MASTER_KEY" }}
  MASTER_KEY: {{ get $old "MASTER_KEY" | quote }}
  {{- else }}
  MASTER_KEY: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  {{- if .Values.setupToken }}
  SETUP_TOKEN: {{ .Values.setupToken | b64enc | quote }}
  {{- else if get $old "SETUP_TOKEN" }}
  SETUP_TOKEN: {{ get $old "SETUP_TOKEN" | quote }}
  {{- else }}
  SETUP_TOKEN: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- end }}

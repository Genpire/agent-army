<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Army</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f2ee; --panel: #fffdf9; --ink: #1c1b19; --muted: #6b675f; --line: #dedad1;
    --accent: #2f5d50; --accent-ink: #fff; --ok: #2f7d4f; --warn: #a8611b; --bad: #a83232;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151614; --panel: #1e201d; --ink: #ecebe6; --muted: #9a978e; --line: #33362f;
      --accent: #7fc4ab; --accent-ink: #10241d; --ok: #7fd09c; --warn: #e0a560; --bad: #ee8a8a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 1.5rem; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 1.05rem; margin: 0; }
  h3 { font-size: 0.95rem; margin: 22px 0 0; }
  p { margin: 8px 0; }
  .muted { color: var(--muted); font-size: 0.9rem; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-bottom: 14px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .step { font: 600 0.75rem var(--mono); color: var(--muted); margin-right: 8px; }
  .pill { font-size: 0.75rem; font-weight: 600; padding: 2px 10px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
  .pill.ok { color: var(--ok); } .pill.todo { color: var(--warn); } .pill.bad { color: var(--bad); } .pill.off { color: var(--muted); }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin: 12px 0 4px; }
  label.check { display: flex; gap: 8px; align-items: center; }
  input:not([type="checkbox"]), textarea, select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--ink); font: inherit; }
  textarea { resize: vertical; line-height: 1.45; }
  textarea.mono, input.mono { font: 0.85rem/1.5 var(--mono); }
  input[type="checkbox"] { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
  input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible, summary:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint { margin: 4px 0 0; font-size: 0.85rem; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .row input { flex: 1; min-width: 0; }
  button, .btn { display: inline-block; margin-top: 14px; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--accent);
    background: var(--accent); color: var(--accent-ink); font: 600 0.95rem system-ui, sans-serif; cursor: pointer; text-decoration: none; }
  button.ghost, .btn.ghost { background: transparent; color: var(--accent); }
  button.small { margin-top: 0; padding: 8px 10px; }
  button.danger { color: var(--bad); border-color: var(--bad); }
  button:disabled { opacity: 0.6; cursor: progress; }
  form > button + button { margin-left: 8px; }
  .msg { margin-top: 10px; font-size: 0.9rem; min-height: 1.2em; }
  .msg.err { color: var(--bad); } .msg.good { color: var(--ok); } .msg.warn { color: var(--warn); }
  code { font-family: var(--mono); font-size: 0.85em; background: var(--bg); padding: 1px 6px; border-radius: 5px; overflow-wrap: anywhere; }
  ol { padding-left: 20px; margin: 8px 0; } li { margin: 4px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  td, th { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  th { border-top: 0; color: var(--muted); font-weight: 600; font-size: 0.8rem; }
  .scroll { overflow-x: auto; }
  .actions { display: flex; gap: 6px; white-space: nowrap; }
  .editor { margin-top: 14px; border-top: 1px solid var(--line); }
  .editor:empty { display: none; }
  details { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
  summary { cursor: pointer; font-weight: 600; }
  .facts { list-style: none; padding: 0; margin: 8px 0 0; }
  .fact { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; margin: 0; padding: 10px 0; border-top: 1px solid var(--line); }
  .fact > div { min-width: 0; overflow-wrap: anywhere; }
  .conn { padding: 12px 0 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
  .vars { list-style: none; padding: 0; margin: 6px 0 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .fact > .actions { flex: none; min-width: auto; }
  /* On narrow screens a repo's Edit / Remove move under its details instead of squeezing them. */
  .fact.setup { flex-wrap: wrap; }
  .fact.setup > div:first-child { flex: 1 1 240px; }
  .vars li { display: flex; align-items: center; gap: 4px; margin: 0; padding: 2px 2px 2px 0; white-space: nowrap; max-width: 100%; }
  .vars button.small { padding: 3px 8px; font-size: 0.8rem; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main id="app"><p class="muted">Loading…</p></main>
<script>
const app = document.getElementById("app");

// Build DOM with textContent only: nothing from the server is parsed as HTML.
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat(Infinity)) if (c != null && c !== false) el.append(c);
  return el;
}

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

const list = (s) => s.split(/[\s,]+/).map((x) => x.trim()).filter(Boolean);
const shortDate = (iso) => new Date(iso).toLocaleDateString([], { dateStyle: "medium" });
// Mirrors REPO_RE in src/config.ts; the server validates again.
const REPO_RE = /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/;

// Runs one API action, reports it in a status element and re-renders on success. Never throws.
async function act(msg, fn, doneText = "Saved.", pendingText = "Saving…") {
  msg.className = "msg"; msg.textContent = pendingText;
  try {
    await fn();
    msg.className = "msg good"; msg.textContent = doneText;
    setTimeout(render, 600);
  } catch (err) { msg.className = "msg err"; msg.textContent = err.message; }
}

// FormData leaves out unchecked checkboxes, so every named checkbox is read explicitly as a boolean.
function readForm(el) {
  const values = Object.fromEntries(new FormData(el));
  for (const box of el.querySelectorAll('input[type="checkbox"][name]')) values[box.name] = box.checked;
  return values;
}

// A form whose submit button shows progress and whose errors appear inline. `extras` sit next to the submit button.
function form(fields, submitLabel, onSubmit, doneText, extras) {
  const msg = h("div", { class: "msg", role: "status" });
  const button = h("button", { type: "submit" }, submitLabel);
  const el = h("form", {
    onsubmit: async (e) => {
      e.preventDefault();
      button.disabled = true;
      await act(msg, () => onSubmit(readForm(el)), doneText, "Checking…");
      button.disabled = false;
    },
  }, fields, button, extras, msg);
  return el;
}

// Ids are unique per render, so two forms with the same field name never share a label target.
let idSeq = 0;
const fieldId = (name) => `f-${name}-${++idSeq}`;

// Label + control, plus an optional hint the control is described by.
function labelled(id, labelText, control, hint) {
  const label = h("label", { for: id }, labelText);
  if (hint == null) return [label, control];
  control.setAttribute("aria-describedby", id + "-hint");
  return [label, control, h("p", { class: "muted hint", id: id + "-hint" }, hint)];
}

const field = (name, labelText, attrs = {}) => {
  const { hint, ...rest } = attrs;
  const id = fieldId(name);
  return labelled(id, labelText, h("input", { id, name, autocomplete: "off", ...rest }), hint);
};

const textareaField = (name, labelText, attrs = {}) => {
  const { hint, value = "", ...rest } = attrs;
  const id = fieldId(name);
  const el = h("textarea", { id, name, rows: 4, ...rest });
  el.value = value;
  return labelled(id, labelText, el, hint);
};

// options: [{ value, label }]. A stored value missing from the list is kept as its own option so saving never drops it.
const selectField = (name, labelText, options, attrs = {}) => {
  const { hint, value = "", ...rest } = attrs;
  const id = fieldId(name);
  const all = options.some((o) => o.value === value) ? options : [...options, { value, label: value }];
  const el = h("select", { id, name, ...rest }, all.map((o) => h("option", { value: o.value }, o.label)));
  el.value = value;
  return labelled(id, labelText, el, hint);
};

const checkboxField = (name, labelText, attrs = {}) => {
  const { hint, checked = false, ...rest } = attrs;
  const id = fieldId(name);
  const box = h("input", { id, name, type: "checkbox", ...rest });
  box.checked = Boolean(checked);
  const label = h("label", { class: "check", for: id }, box, labelText);
  if (hint == null) return label;
  box.setAttribute("aria-describedby", id + "-hint");
  return [label, h("p", { class: "muted hint", id: id + "-hint" }, hint)];
};

// Destructive action in two steps: the first click arms it for 4 seconds, the second runs it.
function confirmButton({ label, confirmLabel, subject, onConfirm }) {
  let timer = null;
  const btn = h("button", { type: "button", class: "ghost small" });
  const show = (text, armed) => {
    btn.textContent = text;
    btn.setAttribute("aria-label", subject ? `${text} ${subject}` : text);
    btn.classList.toggle("danger", armed);
  };
  const disarm = () => { clearTimeout(timer); timer = null; show(label, false); };
  btn.addEventListener("click", async () => {
    if (!timer) { show(confirmLabel, true); timer = setTimeout(disarm, 4000); return; }
    disarm();
    btn.disabled = true;
    try { await onConfirm(); } finally { btn.disabled = false; }
  });
  show(label, false);
  return btn;
}

// Copies text to the clipboard and says so in `msg`; without clipboard access, selects `fallback` for Ctrl+C.
async function copyText(text, msg, doneText, fallback) {
  try {
    await navigator.clipboard.writeText(text);
    msg.className = "msg good"; msg.textContent = doneText;
  } catch {
    fallback?.select();
    msg.className = "msg"; msg.textContent = fallback ? "Selected. Press Ctrl+C (⌘C on a Mac) to copy." : "Couldn't copy. Select the text and copy it.";
  }
}

function card(step, title, ok, okText, todoText, ...body) {
  return h("section", { class: "card" },
    h("div", { class: "card-head" },
      h("h2", {}, step ? h("span", { class: "step" }, step) : null, title),
      h("span", { class: "pill " + (ok ? "ok" : "todo") }, ok ? okText : todoText)),
    body);
}

function gate(state) {
  if (state.setupRequired) {
    return h("section", { class: "card" },
      h("h2", {}, "Create the admin account"),
      h("p", { class: "muted" }, "The setup token was printed by the deploy script (or in the server log on first start). It proves you own this deployment."),
      form([
        field("setupToken", "Setup token", { required: true }),
        field("password", "New admin password (10+ characters)", { type: "password", required: true, minlength: 10, autocomplete: "new-password" }),
      ], "Create account", (v) => api("/api/setup", v), "Account created."));
  }
  return h("section", { class: "card" },
    h("h2", {}, "Sign in"),
    form([field("password", "Admin password", { type: "password", required: true, autocomplete: "current-password" })],
      "Sign in", (v) => api("/api/login", v), "Signed in."));
}

function claudeCard(c) {
  return card("1", "Claude", c.anthropic.connected, "Connected " + (c.anthropic.key || ""), "Needed",
    h("p", { class: "muted" }, "The agents think with your Anthropic API key. Use a dedicated key with a spend limit."),
    form([
      field("apiKey", "Anthropic API key", { type: "password", required: true, placeholder: "sk-ant-…" }),
      field("model", "Model for Pointer (optional)", { value: c.anthropic.model, placeholder: "leave empty for the default" }),
    ], c.anthropic.connected ? "Replace key" : "Verify and save", (v) => api("/api/anthropic", v), "Key verified and saved."));
}

// For apps created before Pointer: the current manifest to paste into Slack, loaded when opened.
function manifestUpdate() {
  const [label, box] = textareaField("manifest", "App manifest (JSON)", { readonly: true, rows: 12, class: "mono", spellcheck: "false", value: "Loading…" });
  const msg = h("div", { class: "msg", role: "status" });
  let loaded = false;
  const load = async () => {
    if (loaded) return;
    loaded = true;
    try {
      const { manifest } = await api("/api/slack/manifest");
      box.value = JSON.stringify(manifest, null, 2);
    } catch (err) {
      loaded = false; box.value = "";
      msg.className = "msg err"; msg.textContent = "Couldn't load the manifest: " + err.message;
    }
  };
  const copy = () => copyText(box.value, msg, "Copied. Paste it into the App Manifest page.", box);
  return h("details", { ontoggle: (e) => { if (e.currentTarget.open) load(); } },
    h("summary", {}, "Already created the app? Update it"),
    h("ol", {},
      h("li", {}, "Open ", h("a", { href: "https://api.slack.com/apps", target: "_blank", rel: "noopener" }, "api.slack.com/apps"), " and choose your app."),
      h("li", {}, "Open ", h("strong", {}, "App Manifest"), ", replace the JSON with the one below, then ", h("strong", {}, "Save"), "."),
      h("li", {}, "Open ", h("strong", {}, "Install App"), " and choose ", h("strong", {}, "Reinstall"), " so Slack grants the new permissions.")),
    h("p", { class: "muted" }, "Apps created with an earlier version are missing some of these permissions: ",
      h("code", {}, "im:history"), " (DMs), ", h("code", {}, "reactions:write"), ", ", h("code", {}, "files:read"), " (reading shared files) and ",
      h("code", {}, "files:write"), " (posting screenshots from browser checks in the task's thread)."),
    label, box,
    h("button", { type: "button", class: "ghost small", style: "margin-top:8px", onclick: copy }, "Copy manifest"),
    msg);
}

function slackCard(c, state) {
  const openManifest = async () => {
    const { createUrl } = await api("/api/slack/manifest");
    window.open(createUrl, "_blank", "noopener");
  };
  return card("2", "Slack", c.slack.connected, "Connected" + (c.slack.teamName ? " to " + c.slack.teamName : ""), "Needed",
    h("ol", {},
      h("li", {}, "Create the Slack app. Everything is pre-filled for this deployment: ",
        h("button", { type: "button", class: "ghost small", onclick: openManifest }, "Create Slack app")),
      h("li", {}, "In the Slack app page: ", h("strong", {}, "Install to Workspace"), "."),
      h("li", {}, "Copy the ", h("strong", {}, "Bot User OAuth Token"), " (OAuth & Permissions) and the ",
        h("strong", {}, "Signing Secret"), " (Basic Information) into the fields below."),
      h("li", {}, "Invite the bot to a channel: ", h("code", {}, "/invite @your-bot"), ".")),
    h("p", { class: "muted" }, "Events URL Slack will call: ", h("code", {}, state.eventsUrl)),
    form([
      field("botToken", "Bot User OAuth Token", { type: "password", required: true, placeholder: "xoxb-…" }),
      field("signingSecret", "Signing Secret", { type: "password", required: true }),
    ], c.slack.connected ? "Replace credentials" : "Verify and save", (v) => api("/api/slack", v), "Slack connected."),
    manifestUpdate());
}

const allowedText = (allowed) => allowed.length ? allowed.join(", ") : "any repository the token can reach";

// One extra connection: who it is, its masked key, its allow list (editable in place) and a two-step Remove.
function githubConnection(x) {
  const who = x.login || "Unknown GitHub user";
  let el;
  const remove = confirmButton({
    label: "Remove", confirmLabel: "Confirm remove", subject: `GitHub connection ${who}`,
    onConfirm: () => act(el.querySelector(".msg"), () => api("/api/github/connections/delete", { id: x.id }), "Removed.", "Removing…"),
  });
  remove.classList.remove("small"); // sits next to the submit button, so the same size
  el = form([
    field("allowed", "Allowed owners or repos (comma separated)", { value: x.allowed.join(", "), placeholder: "owner/repo" }),
  ], "Save", (v) => api("/api/github/connections/update", { id: x.id, allowed: list(v.allowed) }), "Saved.", [remove]);
  return h("li", { class: "conn" },
    h("div", {}, h("strong", {}, who), " ", x.key ? h("code", {}, x.key) : null),
    h("div", { class: "muted" }, "Can use: " + allowedText(x.allowed)),
    el);
}

function githubConnections(c) {
  const extra = c.github.extra;
  return [
    h("h3", {}, "Other GitHub connections"),
    h("p", { class: "muted" }, "For repositories outside your organisation, e.g. a repo on someone's personal account. GitHub's fine-grained tokens only cover one owner, so add a token that can reach that repo (a fine-grained token created by the repo's owner, or a classic token with ",
      h("code", {}, "repo"), " scope) and limit it here to the exact repo."),
    extra.length
      ? h("ul", { class: "facts" }, extra.map(githubConnection))
      : h("p", { class: "muted" }, "None yet."),
    h("h3", {}, "Add connection"),
    form([
      field("token", "GitHub token", { type: "password", required: true, placeholder: "github_pat_… or ghp_…" }),
      field("allowed", "Allowed owners or repos (comma separated)", { placeholder: "owner/repo",
        hint: "Each exact repo is checked with the token before saving. Empty = any repository the token can reach." }),
    ], "Add connection", (v) => api("/api/github/connections", { token: v.token, allowed: list(v.allowed) }), "Connection added."),
  ];
}

// 32 random bytes as hex (64 characters), made in the browser so it can be copied into GitHub before saving.
function randomSecret() {
  const bytes = crypto.getRandomValues(new Uint8Array(32));
  return Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
}

// The GitHub webhook that turns reviews on the team's pull requests into follow-up tasks.
function githubWebhook(c, state, name) {
  const configured = c.github.webhook?.configured === true;
  const url = state.githubWebhookUrl || String(state.eventsUrl || "").replace(/\/slack\/events$/, "/github/webhook");
  const urlMsg = h("span", { role: "status" });
  const urlCode = h("code", {}, url);

  const [secretLabel, secret, secretHint] = field("secret", "Webhook secret", {
    required: true, minlength: 20, maxlength: 200, pattern: "\\S+", spellcheck: "false", autocapitalize: "off", class: "mono",
    placeholder: configured ? "Saved. Enter a new one to replace it" : "Generate one or paste your own",
    title: "20-200 characters, no spaces",
    hint: "Copy it into GitHub before you save: it is stored encrypted and never shown again.",
  });
  let el;
  const generate = h("button", { type: "button", class: "ghost small", onclick: () => {
    secret.value = randomSecret();
    secret.focus(); secret.select();
  } }, "Generate");
  const copySecret = h("button", { type: "button", class: "ghost small", onclick: () => {
    const msg = el.querySelector(".msg");
    if (!secret.value) { msg.className = "msg err"; msg.textContent = "Generate or enter a secret first."; return; }
    copyText(secret.value, msg, "Copied. Paste it into the webhook's Secret field in GitHub.", secret);
  } }, "Copy");
  const remove = configured ? confirmButton({
    label: "Remove", confirmLabel: "Confirm remove", subject: "the GitHub webhook secret",
    onConfirm: () => act(el.querySelector(".msg"), () => api("/api/github/webhook", { secret: "" }), "Removed. GitHub deliveries are now refused.", "Removing…"),
  }) : null;
  remove?.classList.remove("small"); // sits next to the submit button, so the same size

  el = form([secretLabel, secret, h("div", { class: "row" }, generate, copySecret), secretHint],
    configured ? "Replace secret" : "Save secret", (v) => {
      const s = String(v.secret || "");
      if (/\s/.test(s) || s.length < 20 || s.length > 200) throw new Error("The secret must be 20-200 characters, without spaces.");
      return api("/api/github/webhook", { secret: s });
    }, "Saved. GitHub must send the same secret.", [remove]);

  return [
    h("h3", {}, "Pull request reviews (webhook) ", h("span", { class: "pill " + (configured ? "ok" : "off") }, configured ? "Configured" : "Not set up")),
    h("p", { class: "muted" }, `Starts a follow-up task in the task's Slack thread when someone with write access to the repository requests changes or comments in a review of a pull request the team opened, or writes a pull request comment that starts with `,
      h("code", {}, "/pointer"), " or mentions ", h("code", {}, "@pointer"), `. Approvals, bots and people without write access are ignored. If the team is still working in that thread, ${name} posts a note there instead.`),
    h("p", { class: "muted" }, "Payload URL: ", urlCode, " ",
      h("button", { type: "button", class: "ghost small", onclick: () => copyText(url, urlMsg, "Copied.") }, "Copy URL"), " ", urlMsg),
    h("ol", {},
      h("li", {}, "In GitHub, open the repository's or the organisation's ", h("strong", {}, "Settings → Webhooks → Add webhook"), "."),
      h("li", {}, h("strong", {}, "Payload URL"), ": the URL above. ", h("strong", {}, "Content type"), ": ", h("code", {}, "application/json"), "."),
      h("li", {}, h("strong", {}, "Secret"), ": generate one below, copy it into GitHub, then save it here."),
      h("li", {}, "Which events: ", h("strong", {}, "Let me select individual events"), ", then tick ", h("strong", {}, "Pull request reviews"), " and ",
        h("strong", {}, "Issue comments"), " (untick Pushes)."),
      h("li", {}, "Keep ", h("strong", {}, "Active"), " ticked and choose ", h("strong", {}, "Add webhook"), ".")),
    el,
  ];
}

function githubCard(c, state) {
  const n = c.github.extra.length;
  const name = c.team.pointer.name;
  const okText = c.github.connected
    ? "Connected" + (c.github.login ? " as " + c.github.login : "") + (n ? ` +${n}` : "")
    : `${n} connection${n === 1 ? "" : "s"}`;
  return card("3", "GitHub", c.github.connected || n > 0, okText, "Needed",
    h("p", { class: "muted" }, "Create a fine-grained personal access token (ideally on a dedicated bot account) limited to the repositories the agents may work on, with: Contents read/write, Pull requests read/write, Metadata read. Protect your main branch so only humans can merge."),
    h("p", { class: "muted" }, "To wait for a pull request's checks and fix the failing ones (CI checks under Projects), the token also needs Checks read, Commit statuses read and Actions read (for the job logs)."),
    form([
      field("token", "GitHub token", { type: "password", required: true, placeholder: "github_pat_…" }),
      field("allowedOwners", "Allowed owners or repos (comma separated, e.g. your-org, someone/some-repo; empty = any the token can reach)", { value: c.github.allowedOwners.join(", "), placeholder: "your-org" }),
    ], c.github.connected ? "Replace token" : "Verify and save",
      (v) => api("/api/github", { token: v.token, allowedOwners: list(v.allowedOwners) }), "GitHub connected."),
    githubConnections(c),

const boardLabel = (b) => `${b.name}${b.workspace ? ` (${b.workspace})` : ""} · ${b.id}`;

// Default board and allowed boards. The picker lists the 50 most recently used boards; search finds others.
function mondayBoards(m, name) {
  const noBoard = { value: "", label: `None (${name} asks which board)` };
  const known = new Map();
  const status = h("span", { "aria-live": "polite" }, "Loading boards…");
  const [selLabel, select, selHint] = selectField("defaultBoardId", "Default board for tickets", [noBoard], { value: m.defaultBoardId || "", hint: status });

  // Keeps the current choice (saved or just picked) as an option even when the list doesn't contain it.
  const fill = (boards) => {
    const current = select.value;
    const options = [noBoard, ...boards.map((b) => ({ value: b.id, label: boardLabel(b) }))];
    if (!options.some((o) => o.value === current)) {
      const b = known.get(current);
      options.push({ value: current, label: b ? boardLabel(b) : `Board ${current}` });
    }
    select.replaceChildren(...options.map((o) => h("option", { value: o.value }, o.label)));
    select.value = current;
  };

  const [searchLabel, search] = field("boardSearch", "Find a board by name", { type: "search", placeholder: "Bugs",
    onkeydown: (e) => { if (e.key === "Enter") { e.preventDefault(); load(); } } });
  search.removeAttribute("name"); // not part of the saved settings
  const searchButton = h("button", { type: "button", class: "ghost small", onclick: () => load() }, "Search");

  const load = async () => {
    const q = search.value.trim();
    status.className = ""; status.textContent = "Loading boards…";
    searchButton.disabled = true;
    try {
      const { boards } = await api("/api/monday/boards" + (q ? "?search=" + encodeURIComponent(q) : ""));
      boards.forEach((b) => known.set(b.id, b));
      fill(boards);
      status.textContent = q
        ? (boards.length ? `${boards.length} board${boards.length === 1 ? " matches" : "s match"} “${q}”.` : `No boards match “${q}”.`)
        : `The ${boards.length} most recently used boards. Search to find others.`;
    } catch (err) {
      status.className = "msg err"; status.textContent = "Couldn't load boards: " + err.message;
    } finally {
      searchButton.disabled = false;
    }
  };
  load();

  return [
    h("h3", {}, "Boards"),
    form([
      selLabel, select, selHint,
      searchLabel, h("div", { class: "row" }, search, searchButton),
      field("allowedBoardIds", `Boards ${name} may use (comma separated board ids)`, { value: m.allowedBoardIds.join(", "), placeholder: "1234567890, 2345678901",
        hint: `A board's id is the number in its URL (…/boards/1234567890). Empty = every board the monday.com user can see; otherwise include the default board. ${name} never deletes or archives anything.` }),
    ], "Save boards", (v) => api("/api/monday", { defaultBoardId: v.defaultBoardId, allowedBoardIds: list(v.allowedBoardIds) })),
  ];
}

function slugId(name, taken) {
  let base = name.toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  if (/^[0-9]/.test(base)) base = "agent-" + base;
  base = base.slice(0, 31).replace(/-+$/, "");
  if (base.length < 2) base = base ? base + "-agent" : "agent";
  const free = (id) => !taken.has(id) && !RESERVED_AGENT_IDS.includes(id);
  let id = base;
  for (let n = 2; !free(id); n++) {
    const suffix = "-" + n;
    id = base.slice(0, 31 - suffix.length).replace(/-+$/, "") + suffix;
  }
  return id;
}

// "robot_face", ":robot_face" and ":robot_face:" all become ":robot_face:".
const normEmoji = (s) => {
  const code = s.trim().toLowerCase().replace(/^:+|:+$/g, "");
  return code ? `:${code}:` : "";
};

function notesCard(data) {
  const { notes, max, error } = data;
  const msg = h("div", { class: "msg", role: "status" });
  const editor = h("div", { class: "editor" });

  // Existing notes are loaded first; a repo without notes starts empty. Repos are case-insensitive.
  const openEditor = async (repo, trigger) => {
    const existing = notes.find((n) => n.repo.toLowerCase() === repo.toLowerCase());
    let text = "";
    if (existing) {
      msg.className = "msg"; msg.textContent = "Loading…";
      try { ({ text } = await api(notePath(existing.repo))); msg.textContent = ""; }
      catch (err) { msg.className = "msg err"; msg.textContent = "Couldn't load the notes: " + err.message; return; }
    }
    const close = () => { editor.replaceChildren(); trigger.focus(); };
    editor.replaceChildren(noteEditor(existing ? existing.repo : repo, text, Boolean(existing), max, close));
    editor.scrollIntoView({ block: "start" });
    editor.querySelector("textarea").focus({ preventScroll: true });
  };

  const body = error
    ? h("p", { class: "msg err" }, "Couldn't load project notes: " + error)
    : notes.length
      ? h("ul", { class: "facts" }, notes.map((n) => {
          const open = h("button", { type: "button", class: "ghost small", "aria-label": `Open notes for ${n.repo}`, onclick: () => openEditor(n.repo, open) }, "Open");
          return h("li", { class: "fact" },
            h("div", {}, h("code", {}, n.repo),
              h("div", { class: "muted" }, `${n.chars.toLocaleString()} characters · updated `, h("time", { datetime: n.updatedAt }, shortDate(n.updatedAt)))),
            open);
        }))
      : h("p", { class: "muted" }, "No notes yet. The team writes them at the end of each repo task, or add some below.");

  const [addLabel, addInput] = field("repo", "Add notes for a repo", { placeholder: "owner/repo" });
  const addButton = h("button", { type: "submit", class: "ghost small" }, "Open editor");
  const addForm = h("form", {
    onsubmit: (e) => {
      e.preventDefault();
      const repo = addInput.value.trim();
      if (!REPO_RE.test(repo)) { msg.className = "msg err"; msg.textContent = "Repos look like owner/repo."; return; }
      openEditor(repo, addInput);
    },
  }, addLabel, h("div", { class: "row" }, addInput, addButton));

  return card(null, "Project notes", !error && notes.length > 0, `${notes.length} repo${notes.length === 1 ? "" : "s"}`, error ? "Unavailable" : "None yet",
    h("p", { class: "muted" }, "What the team has learned about each repository. Read at the start of every task and updated at the end."),
    body, error ? null : addForm, editor, msg);
}

// ---------- Repo setup ----------

// Mirror ENV_KEY_RE, RESERVED_ENV_KEYS and the limits of RepoSetupSchema in src/config.ts; the server validates again.
const ENV_KEY_RE = /^[A-Za-z_][A-Za-z0-9_]{0,127}$/;
const RESERVED_ENV_KEYS = ["PATH", "HOME", "LANG", "CI", "ANTHROPIC_API_KEY", "MASTER_KEY", "SETUP_TOKEN", "TASK_B64", "CLAUDE_AGENT_SDK_CLIENT_APP", "PLAYWRIGHT_BROWSERS_PATH"];
const REPO_SETUP_MAX_ENV = 100;
const ENV_VALUE_MAX = 10000;
const APP_URL_RE = /^https?:\/\/\S+$/;

// "NAME=value" lines → { env, errors }. Blank lines and # comments are skipped; a leading `export ` and
// quotes around a value are dropped, as in a .env file. Errors name the line and variable, never the value.
function parseEnvLines(text) {
  const env = {};
  const errors = [];
  String(text || "").split(/\r?\n/).forEach((raw, i) => {
    const line = raw.trim();
    if (!line || line.startsWith("#")) return;
    const at = `Line ${i + 1}`;
    const eq = line.indexOf("=");
    const name = (eq < 0 ? line : line.slice(0, eq)).trim().replace(/^export\s+/, "");
    if (eq < 0) return errors.push(`${at}: write NAME=value.`);
    if (!ENV_KEY_RE.test(name)) return errors.push(`${at}: “${name.slice(0, 40)}” is not a variable name (letters, digits and _, not starting with a digit).`);
    if (RESERVED_ENV_KEYS.includes(name)) return errors.push(`${at}: ${name} is set by the platform and cannot be changed here.`);
    if (name in env) return errors.push(`${at}: ${name} is listed twice.`);
    let value = line.slice(eq + 1).trim();
    if (value.length >= 2 && (value[0] === '"' || value[0] === "'") && value.at(-1) === value[0]) value = value.slice(1, -1);
    if (value.length > ENV_VALUE_MAX) return errors.push(`${at}: the value of ${name} is longer than ${ENV_VALUE_MAX.toLocaleString()} characters.`);
    env[name] = value;
  });
  return { env, errors };
}

function repoSetupCard(c) {
  const setups = c.repoSetup || {};
  const repos = Object.keys(setups).sort((a, b) => a.localeCompare(b));
  const findRepo = (repo) => repos.find((r) => r.toLowerCase() === repo.trim().toLowerCase());
  const msg = h("div", { class: "msg", role: "status" });

  const heading = h("h3", {}, "Add or change a repo");
  const savedKeys = h("span", {});
  const [repoLabel, repoInput, repoHint] = field("repo", "Repository", { required: true, placeholder: "owner/repo", spellcheck: "false", autocapitalize: "off",
    hint: "A repo that is already set up opens with its saved values." });
  const [setupLabel, setupInput, setupHint] = field("setupCommand", "Setup command (optional)", { maxlength: 2000, placeholder: "npm ci", class: "mono", spellcheck: "false", autocapitalize: "off",
    hint: "Runs once after the checkout, before the team starts. The team is told whether it worked and sees the end of its output." });
  const [startLabel, startInput, startHint] = field("startCommand", "Start command (optional)", { maxlength: 500, placeholder: "npm run dev", class: "mono", spellcheck: "false", autocapitalize: "off",
    hint: "How the agents start the app for browser checks. Empty = the project's own dev script." });
  const [urlLabel, urlInput, urlHint] = field("appUrl", "App URL (optional)", { type: "url", maxlength: 300, placeholder: "http://localhost:3000",
    hint: "Where the started app answers." });
  const [envLabel, envInput, envHint] = textareaField("env", "Environment variables to add or change (optional)", {
    rows: 4, class: "mono", spellcheck: "false", autocomplete: "off", autocapitalize: "off",
    placeholder: "DATABASE_URL=postgres://localhost:5432/app\nNEXT_PUBLIC_API_URL=http://localhost:4000",
    hint: ["One NAME=value per line. They are set in the agents' shell; values are stored encrypted and never shown again. Leave a name out to keep its saved value; remove one from the list above. Use development or test credentials: the agents can read them. ", savedKeys],
  });

  // Fills the form with a saved repo's values. On a typed repo, only when nothing else has been entered yet.
  const fill = (repo, force) => {
    const key = findRepo(repo);
    const s = key ? setups[key] : null;
    const untouched = !setupInput.value && !startInput.value && !urlInput.value && !envInput.value;
    heading.textContent = key ? `Edit ${key}` : "Add or change a repo";
    savedKeys.textContent = s?.envKeys.length ? `Saved: ${s.envKeys.join(", ")}.` : "";
    if (!s || !(force || untouched)) return;
    repoInput.value = key;
    setupInput.value = s.setupCommand || "";
    startInput.value = s.startCommand || "";
    urlInput.value = s.appUrl || "";
    if (force) envInput.value = "";
  };
  repoInput.addEventListener("change", () => fill(repoInput.value, false));

  const editForm = form([
    repoLabel, repoInput, repoHint, setupLabel, setupInput, setupHint, startLabel, startInput, startHint,
    urlLabel, urlInput, urlHint, envLabel, envInput, envHint,
  ], "Save", (v) => {
    const repo = v.repo.trim();
    if (!REPO_RE.test(repo)) throw new Error("Repos look like owner/repo.");
    const appUrl = v.appUrl.trim();
    if (appUrl && !APP_URL_RE.test(appUrl)) throw new Error("The app URL must start with http:// or https://.");
    const { env, errors } = parseEnvLines(v.env);
    if (errors.length) throw new Error(errors.slice(0, 3).join(" ") + (errors.length > 3 ? ` (and ${errors.length - 3} more)` : ""));
    const existing = findRepo(repo);
    const body = { repo: existing || repo, setupCommand: v.setupCommand.trim(), startCommand: v.startCommand.trim(), appUrl };
    if (!existing && !body.setupCommand && !body.startCommand && !appUrl && !Object.keys(env).length) {
      throw new Error("Enter a setup command, a start command, an app URL or a variable.");
    }
    const keys = new Set([...(existing ? setups[existing].envKeys : []), ...Object.keys(env)]);
    if (keys.size > REPO_SETUP_MAX_ENV) throw new Error(`At most ${REPO_SETUP_MAX_ENV} variables per repository.`);
    if (Object.keys(env).length) body.env = env;
    return api("/api/repo-setup", body);
  }, "Saved. Variable values are stored encrypted and not shown again.");

  const edit = (repo) => {
    fill(repo, true);
    heading.scrollIntoView({ block: "start" });
    setupInput.focus({ preventScroll: true });
  };

  const detail = (labelText, value) => (value ? h("div", { class: "muted" }, labelText, h("code", {}, value)) : null);
  const item = (repo) => {
    const s = setups[repo];
    const editButton = h("button", { type: "button", class: "ghost small", "aria-label": `Edit the setup of ${repo}`, onclick: () => edit(repo) }, "Edit");
    const remove = confirmButton({
      label: "Remove", confirmLabel: "Confirm remove", subject: `the setup of ${repo}`,
      onConfirm: () => act(msg, () => api("/api/repo-setup/delete", { repo }), `Removed the setup of ${repo}.`, "Removing…"),
    });
    const vars = s.envKeys.length
      ? h("ul", { class: "vars", "aria-label": `Variables of ${repo}` }, s.envKeys.map((k) => h("li", {}, h("code", {}, k),
          confirmButton({
            label: "Remove", confirmLabel: "Confirm", subject: `variable ${k} of ${repo}`,
            onConfirm: () => act(msg, () => api("/api/repo-setup", { repo, env: { [k]: null } }), `Removed ${k} from ${repo}.`, "Removing…"),
          }))))
      : null;
    return h("li", { class: "fact setup" },
      h("div", {}, h("code", {}, repo),
        detail("Setup: ", s.setupCommand), detail("Start: ", s.startCommand), detail("App URL: ", s.appUrl),
        h("div", { class: "muted" }, s.envKeys.length ? `Variables (${s.envKeys.length}):` : "No variables."), vars),
      h("div", { class: "actions" }, editButton, remove));
  };

  return card(null, "Repo setup", repos.length > 0, `${repos.length} repo${repos.length === 1 ? "" : "s"}`, "Optional",
    h("p", { class: "muted" }, "How repo tasks prepare and run a repository: a setup command run once after the checkout (e.g. ",
      h("code", {}, "npm ci"), "), how to start the app and where it answers (for browser checks), and environment variables for the agents' shell."),
    repos.length ? h("ul", { class: "facts" }, repos.map(item)) : h("p", { class: "muted" }, "No repos set up yet. Tasks on other repos work out the setup from the project itself."),
    msg, heading, editForm);
}

const money = (n) => "$" + (n ?? 0).toFixed(2);

// Claude spend this month: chat replies and repo tasks, plus the costliest tasks.
function spendSummary(usage) {
  if (!usage) return null;
  if (usage.error) return h("p", { class: "msg err" }, usage.error);
  return h("div", { class: "spend" },
    h("p", {}, h("strong", {}, `Claude spend in ${usage.month} (UTC): ${money(usage.totalUsd)}`), h("br"),
      h("span", { class: "muted" },
        `Chat ${money(usage.chat.usd)} over ${usage.chat.count} replies · Repo tasks ${money(usage.tasks.usd)} over ${usage.tasks.count} tasks`)),
    usage.topTasks.length ? h("p", { class: "muted" }, "Costliest tasks: ",
      usage.topTasks.map((t, i) => [i ? " · " : "", money(t.costUsd), " ",
        t.instruction.length > 50 ? t.instruction.slice(0, 50) + "…" : t.instruction])) : null);
}

// The pull request's checks after the task's last push (Task.ci), e.g. "Checks failed: test (2 fix rounds)".
function checksText(ci) {
  const rounds = ci.fixRounds ? ` (${ci.fixRounds} fix round${ci.fixRounds === 1 ? "" : "s"})` : "";
  if (ci.state === "none") return "No checks";
  if (ci.state === "passed") return `Checks passed${rounds}`;
  const failing = ci.names || [];
  const names = failing.length ? ": " + failing.slice(0, 3).join(", ") + (failing.length > 3 ? "…" : "") : "";
  return `Checks ${ci.state === "failed" ? "failed" : "still running"}${names}${rounds}`;
}

function activityCard(tasks, usage) {
  const body = tasks.length
    ? h("div", { class: "scroll" }, h("table", {},
        h("thead", {}, h("tr", {}, ["When", "Project", "Request", "Status"].map((t) => h("th", {}, t)))),
        h("tbody", {}, tasks.map((t) => h("tr", {},
          h("td", {}, new Date(t.createdAt).toLocaleString([], { dateStyle: "short", timeStyle: "short" })),
          h("td", {}, h("code", {}, t.repo)),
          h("td", {}, t.instruction.length > 90 ? t.instruction.slice(0, 90) + "…" : t.instruction,
            t.trigger === "review" ? h("div", { class: "muted" }, "Started by a pull request review") : null),
          h("td", {},
            h("span", { class: "pill " + (t.status === "done" ? "ok" : t.status === "failed" ? "bad" : "todo") }, t.status),
            t.prUrl ? [" ", h("a", { href: t.prUrl, target: "_blank", rel: "noopener" }, "PR")] : null,
            t.costUsd != null ? h("div", { class: "muted" }, "$" + t.costUsd.toFixed(2)) : null,
            t.ci ? h("div", { class: "muted" }, checksText(t.ci)) : null,
            t.status === "running" && t.progress ? h("div", { class: "muted" }, "Now: " + t.progress.now) : null,
            t.error ? h("div", { class: "muted" }, t.error.slice(0, 140)) : null))))))
    : h("p", { class: "muted" }, "No tasks yet. Mention the bot in Slack to start one.");
  return h("section", { class: "card" },
    h("div", { class: "card-head" }, h("h2", {}, "Activity"),
      h("button", { type: "button", class: "ghost small", onclick: render }, "Refresh")),
    spendSummary(usage),
    body);
}

// "Pointer and the team · Coder · Reviewer · …"
const teamLine = (team) => team
  ? [`${team.pointer.name} and the team`, ...enabledAgents(team).map((a) => a.name)].join(" · ")
  : "Pointer and the team, in Slack";

async function render() {
  let state;
  try { state = await api("/api/state"); }
  catch (err) { app.replaceChildren(h("p", { class: "msg err" }, err.message)); return; }

  const header = h("header", {},
    h("div", {}, h("h1", {}, state.config?.orgName ? state.config.orgName + " · Agent Army" : "Agent Army"),
      h("div", { class: "muted" }, teamLine(state.config?.team))),
    state.authed ? h("div", {},
      h("span", { class: "pill " + (state.ready ? "ok" : "todo") }, state.ready ? "Ready for orders" : "Setup incomplete"), " ",
      h("button", { type: "button", class: "ghost small", onclick: async () => { await api("/api/logout", {}); render(); } }, "Sign out")) : null);

  if (!state.authed) { app.replaceChildren(header, gate(state)); return; }

  const [{ tasks }, usage, memory, notes] = await Promise.all([
    api("/api/tasks").catch(() => ({ tasks: [] })),
    api("/api/usage").catch((err) => ({ error: err.message })),
    api("/api/memory").catch((err) => ({ facts: [], max: 100, error: err.message })),
    api("/api/notes").catch((err) => ({ notes: [], max: 8000, error: err.message })),
  ]);
  const c = state.config;
  app.replaceChildren(header,
    claudeCard(c), slackCard(c, state), githubCard(c, state), mondayCard(c.monday, c.team.pointer.name), teamCard(c.team), projectsCard(c), repoSetupCard(c),
    memoryCard(memory, c.team.pointer.name), notesCard(notes), activityCard(tasks, usage),
    h("p", { class: "muted" }, "Runner: ", h("code", {}, state.runner), " · Storage: ", h("code", {}, state.storage)));
}
render();
</script>
</body>
</html>
